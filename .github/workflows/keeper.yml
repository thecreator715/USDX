name: USDX keeper
# Runs the peg keeper on GitHub's servers, around the clock, with the app closed.
# It mints USDX for BONSAI deposits, defends both AMM pools and keeps the DEX quotes at the $1.00 peg.
# Seeds live only in encrypted repository secrets: Settings > Secrets and variables > Actions.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'keeper/**'
      - '.github/workflows/keeper.yml'
      - 'config.json'
concurrency:
  group: usdx-keeper
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: keeper
        run: npm ci --omit=dev
      - name: Run keeper (about 4.5 minutes, then the next run takes over)
        working-directory: keeper
        env:
          RECEIVER_SEED: ${{ secrets.RECEIVER_SEED || secrets.RECIEVER || secrets.RECEIVER }}
          ISSUER_SEED: ${{ secrets.ISSUER_SEED || secrets.ISSUER }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          LIVE: '1'
          INTERVAL_SEC: '30'
        run: |
          set +e
          timeout 270 node keeper.mjs 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          [ $rc -eq 0 ] || [ $rc -eq 124 ]
      - name: Publish the run log (branch keeper-log, no secrets in it)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir /tmp/kl && tail -n 300 keeper/run.log | sed -E 's/s[A-Za-z0-9]{24,}/[hidden]/g' > /tmp/kl/last-run.log
          cd /tmp/kl && git init -q -b keeper-log && git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm "keeper run $GITHUB_RUN_ID" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" keeper-log || true
      - name: Start the next run (keeps the keeper going even when GitHub delays the schedule)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keeper.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" || true
