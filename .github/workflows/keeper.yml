name: USDX keeper
# Runs the peg keeper on GitHub's servers, around the clock, with the app closed.
# It mints USDX for BONSAI deposits, defends both AMM pools and keeps the DEX quotes at the $1.00 peg.
# Seeds live only in encrypted repository secrets: Settings > Secrets and variables > Actions.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'keeper/**'
      - '.github/workflows/keeper.yml'
      - 'config.json'
concurrency:
  group: usdx-keeper
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Queue the next run now, so it starts the moment this one ends
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keeper.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" || true
      - name: Install
        working-directory: keeper
        run: npm ci --omit=dev
      - name: Run keeper (20 minutes; the log is published every 30 seconds)
        working-directory: keeper
        env:
          RECEIVER_SEED: ${{ secrets.RECEIVER_SEED || secrets.RECIEVER || secrets.RECEIVER }}
          ISSUER_SEED: ${{ secrets.ISSUER_SEED || secrets.ISSUER }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          LIVE: '1'
        run: |
          set +e
          timeout 1200 node keeper.mjs > run.log 2>&1 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 30
            bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" "$PWD/run.log"
          done
          wait $PID
          bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" "$PWD/run.log"
          exit 0
